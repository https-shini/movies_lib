<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Cinelux, seu acervo de cinema. Descubra filmes, veja do que se trata cada um e encontre onde assistir no Brasil."
    />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!-- Dados do destaque do Início pedidos junto com o JavaScript (D-42). A URL precisa
         ser igual à de getMovieList("popular", 1) em src/services/tmdb.ts. -->
    <link
      rel="preload"
      href="/api/tmdb/movie/popular?language=pt-BR&page=1&region=BR"
      as="fetch"
      crossorigin="anonymous"
    />
    <title>Cinelux · Seu acervo de cinema</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
